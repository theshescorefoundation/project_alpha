# Databricks Asset Bundle for Project Alpha - the weekly CQI job.
#   databricks bundle validate
#   databricks bundle deploy -t dev          # uploads this folder + creates the job (schedule starts PAUSED)
#   databricks bundle run project_alpha_weekly -t dev
# Requires the Databricks CLI (v0.218+) and a profile for your workspace (`databricks auth login`).
bundle:
  name: project-alpha

variables:
  cluster_policy_id:
    description: Cluster policy approved for PHI workloads (VERIFY)
    default: ""
  notify:
    description: Who hears about failures
    default: "<FILL IN: team@company.com>"

resources:
  jobs:
    project_alpha_weekly:
      name: "Project Alpha · weekly CQI agent"
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"      # Mondays 06:00, before the weekly Patient Conference
        timezone_id: "America/New_York"
        pause_status: PAUSED                          # unpause once the VERIFY paths are confirmed
      email_notifications:
        on_failure: ["${var.notify}"]
      parameters:
        - name: as_of_date                            # blank = latest risk_scores run date
          default: ""
        - name: source                                # auto = Unity Catalog table if configured, else lake path, else csv
          default: "auto"
        - name: branches
          default: ""
      job_clusters:
        - job_cluster_key: alpha
          new_cluster:
            spark_version: "16.4.x-scala2.12"          # VERIFY: needs Python 3.12+ (DBR 16.x) - the original pipeline uses 3.12 f-string syntax
            node_type_id: "Standard_D4ds_v5"          # VERIFY: cloud / size
            num_workers: 1
            policy_id: "${var.cluster_policy_id}"
            spark_env_vars:
              PROJECT_ALPHA_CONFIG: "/Workspace${workspace.file_path}/config/project_alpha.yaml"
      tasks:
        - task_key: resolve_run_date
          job_cluster_key: alpha
          notebook_task:
            notebook_path: ./databricks/00_resolve_run_date.py
            base_parameters: {as_of_date: "{{job.parameters.as_of_date}}", source: "{{job.parameters.source}}"}
          libraries: [{pypi: {package: pyyaml}}]

        - task_key: build_booklets                    # the ORIGINAL pipeline notebook, unchanged
          depends_on: [{task_key: resolve_run_date}]
          job_cluster_key: alpha
          notebook_task:
            notebook_path: ./cqi_booklet/notebooks/01_build_booklets.py
            base_parameters:
              as_of_date: "{{tasks.resolve_run_date.values.as_of_date}}"
              source: "{{job.parameters.source}}"
              branches: "{{job.parameters.branches}}"
              render_pdfs: "yes"
              format: "both"
          libraries: [{pypi: {package: reportlab}}, {pypi: {package: matplotlib}}, {pypi: {package: jsonschema}},
                      {pypi: {package: pypdf}}, {pypi: {package: pyyaml}}]

        - task_key: load_decisions                    # conference decisions uploaded from the app -> Delta
          job_cluster_key: alpha
          notebook_task:
            notebook_path: ./databricks/04_load_decisions.py

        - task_key: cqi_agent_and_branch_reports
          depends_on: [{task_key: build_booklets}, {task_key: load_decisions}]
          job_cluster_key: alpha
          notebook_task:
            notebook_path: ./databricks/02_project_alpha_weekly.py
            base_parameters:
              as_of_date: "{{tasks.resolve_run_date.values.as_of_date}}"
              source: "{{job.parameters.source}}"
              branches: "{{job.parameters.branches}}"
          libraries: [{pypi: {package: reportlab}}, {pypi: {package: matplotlib}}, {pypi: {package: pyyaml}}]

    # ------------------------------------------------------------------------------------------
    # LIGHTWEIGHT: the CQI agent only. No PDFs, no AI libraries - pandas (in the runtime) + pyyaml.
    # Use this when PDF / AI packages can't be installed, or to refresh findings mid-week.
    # ------------------------------------------------------------------------------------------
    project_alpha_agent_only:
      name: "Project Alpha · CQI agent only"
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "America/New_York"
        pause_status: PAUSED
      email_notifications:
        on_failure: ["${var.notify}"]
      parameters:
        - name: as_of_date
          default: ""
        - name: source
          default: "auto"
        - name: branches
          default: ""
      job_clusters:
        - job_cluster_key: alpha_light
          new_cluster:
            spark_version: "16.4.x-scala2.12"          # VERIFY: Python 3.12+ runtime
            node_type_id: "Standard_D4ds_v5"          # VERIFY
            num_workers: 1
            policy_id: "${var.cluster_policy_id}"
            spark_env_vars:
              PROJECT_ALPHA_CONFIG: "/Workspace${workspace.file_path}/config/project_alpha.yaml"
      tasks:
        - task_key: resolve_run_date
          job_cluster_key: alpha_light
          notebook_task:
            notebook_path: ./databricks/00_resolve_run_date.py
            base_parameters: {as_of_date: "{{job.parameters.as_of_date}}", source: "{{job.parameters.source}}"}
          libraries: [{pypi: {package: pyyaml}}]

        - task_key: load_decisions
          job_cluster_key: alpha_light
          notebook_task:
            notebook_path: ./databricks/04_load_decisions.py

        - task_key: cqi_agent
          depends_on: [{task_key: resolve_run_date}, {task_key: load_decisions}]
          job_cluster_key: alpha_light
          notebook_task:
            notebook_path: ./databricks/03_agent_only.py
            base_parameters:
              as_of_date: "{{tasks.resolve_run_date.values.as_of_date}}"
              source: "{{job.parameters.source}}"
              branches: "{{job.parameters.branches}}"
          libraries: [{pypi: {package: pyyaml}}]

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: "<FILL IN: https://adb-xxxx.azuredatabricks.net>"
